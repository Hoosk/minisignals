name: Publish to NPM

on:
  release:
    types: [created] # Se dispara al crear una release en GitHub

permissions:
  contents: read
  id-token: write # Requerido por npm Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          scope: '@hoosk'

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build packages
        run: npm run build

      - name: Publish Core
        working-directory: ./packages/core
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE}@${VERSION}" version 2>/dev/null | grep -q "${VERSION}"; then
            echo "${PACKAGE}@${VERSION} already published, skipping"
          else
            npm publish --access public
          fi

      - name: Publish React Adapter
        working-directory: ./packages/react
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE}@${VERSION}" version 2>/dev/null | grep -q "${VERSION}"; then
            echo "${PACKAGE}@${VERSION} already published, skipping"
          else
            npm publish --access public
          fi

      # Vue quedó pendiente de aprobación en el flujo de staged publishing de npm.
      # Cuando esté resuelto, activa la variable de repositorio PUBLISH_VUE=true.
      - name: Publish Vue Adapter
        if: vars.PUBLISH_VUE == 'true'
        working-directory: ./packages/vue
        run: |
          VERSION=$(node -p "require('./package.json').version")
          PACKAGE=$(node -p "require('./package.json').name")
          if npm view "${PACKAGE}@${VERSION}" version 2>/dev/null | grep -q "${VERSION}"; then
            echo "${PACKAGE}@${VERSION} already published, skipping"
          else
            npm publish --access public
          fi
